openapi: 3.0.3
info:
  title: Upfund Landing Page API
  description: API Agregator untuk Landing Page Upfund (BFF Pattern).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api
    description: Development server

paths:
  /landing-page:
    get:
      summary: Mendapatkan data agregat untuk Landing Page
      description: Mengambil data proyek unggulan (top projects), proyek per kategori, dan proyek hangat (hot projects) dalam satu request.
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageResponse'

  /projects:
    get:
      summary: Mendapatkan daftar proyek (berpaginasi)
      description: >
        Mengambil daftar proyek berpaginasi (9 item per halaman), dapat difilter
        berdasarkan kategori. Setiap item menyertakan agregat interaksi
        (likes_count, shares_count, investors_count) serta relasi user (ringkas),
        categories, dan images.
      parameters:
        - name: category
          in: query
          required: false
          description: Filter proyek berdasarkan judul kategori (mis. "Teknologi").
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar proyek berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListResponse'
        '500':
          description: Gagal mengambil daftar proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LandingPageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Landing page data fetched successfully
        data:
          type: object
          properties:
            top_projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            category_projects:
              type: array
              items:
                $ref: '#/components/schemas/CategoryProjects'
            hot_projects:
              type: array
              items:
                $ref: '#/components/schemas/HotProject'

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, investor, creator]
        date:
          type: string
          format: date-time
        is_verified:
          type: boolean

    ProjectImage:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
          format: uri
        project_id:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        project_images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    HotProject:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            comments_count:
              type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    CategoryProjects:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    # ----------------------------------------------------------------------
    # Schema khusus GET /projects
    #
    # Dibuat terpisah dari schema landing-page (Project/User) karena bentuk
    # response-nya berbeda: relasi gambar memakai key `images` (bukan
    # `project_images`), objek user diringkas (id/username/name saja), dan
    # ditambahkan agregat likes_count/shares_count/investors_count.
    # `comments_count` TIDAK disertakan di sini karena service /projects
    # tidak memanggil withCount('comments').
    # ----------------------------------------------------------------------

    ProjectsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Projects retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProjectListItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        likes_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0
        investors_count:
          type: integer
          example: 0
        user:
          $ref: '#/components/schemas/ProjectListUser'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCategory'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    ProjectListUser:
      type: object
      description: Representasi ringkas user (membatasi kolom sensitif).
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string

    ProjectCategory:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 9
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 5
        has_more_pages:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Failed to retrieve projects
        error:
          type: string
          description: Detail teknis error (sebaiknya disembunyikan di production).
