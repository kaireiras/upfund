openapi: 3.0.3
info:
  title: Upfund Landing Page API
  description: API Agregator untuk Landing Page Upfund (BFF Pattern).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api
    description: Development server

paths:
  /landing-page:
    get:
      summary: Mendapatkan data agregat untuk Landing Page
      description: Mengambil data carousel, kategori, dan proyek unggulan dalam satu request.
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  carousel:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectImage'
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        valuation:
          type: integer
        collected_funds:
          type: integer
        project_images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    ProjectImage:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        image_url:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
