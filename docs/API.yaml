openapi: 3.0.3
info:
  title: Upfund Landing Page API
  description: API Agregator untuk Landing Page Upfund (BFF Pattern).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api
    description: Development server

paths:
  /landing-page:
    get:
      summary: Mendapatkan data agregat untuk Landing Page
      description: Mengambil data proyek unggulan (top projects), proyek per kategori, dan proyek hangat (hot projects) dalam satu request.
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageResponse'

  /projects:
    get:
      summary: Mendapatkan daftar proyek (berpaginasi)
      description: >
        Mengambil daftar proyek berpaginasi (9 item per halaman), dapat difilter
        berdasarkan kategori. Setiap item menyertakan agregat interaksi
        (likes_count, shares_count, investors_count) serta relasi user (ringkas),
        categories, dan images.
      parameters:
        - name: category
          in: query
          required: false
          description: Filter proyek berdasarkan judul kategori (mis. "Teknologi").
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar proyek berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListResponse'
        '500':
          description: Gagal mengambil daftar proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}:
    get:
      summary: Mendapatkan detail sebuah proyek
      description: >
        Mengambil detail lengkap satu proyek beserta relasi (owner, categories,
        images, status_timeline, milestones, shareholders, public_events),
        agregat interaksi (likes_count, shares_count, investors_count), serta
        ringkasan posts & comments (total + preview).
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
      responses:
        '200':
          description: Detail proyek berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil detail proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/comments:
    get:
      summary: Mendapatkan daftar komentar sebuah proyek (berpaginasi)
      description: Mengambil komentar proyek berpaginasi (15 item per halaman), diurutkan dari yang terbaru.
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar komentar berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsListResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil komentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/posts:
    get:
      summary: Mendapatkan daftar posts sebuah proyek (berpaginasi)
      description: Mengambil posts proyek berpaginasi (15 item per halaman), diurutkan dari yang terbaru.
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar posts berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsListResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Mendapatkan Bearer Token untuk autentikasi API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login_body'
      responses:
        '200':
          description: Login Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
        '401':
          description: Kredensial tidak valid

  /posts:
    get:
      tags:
        - Posts
      summary: Mendapatkan Feed Postingan (Paginated)
      parameters:
        - name: page
          in: query
          description: Nomor halaman pagination
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Daftar postingan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_1'
    post:
      tags:
        - Posts
      summary: Membuat Postingan Baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/posts_body'
      responses:
        '201':
          description: Postingan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Mendapatkan Detail Postingan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Detail postingan berhasil ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_2'
        '404':
          description: Post tidak ditemukan

  /posts/toggle-like:
    post:
      tags:
        - Posts
      summary: Toggle Like/Unlike Post atau Project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/posts_togglelike_body'
      responses:
        '200':
          description: Berhasil mengubah status Like
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_3'

  /comments:
    get:
      tags:
        - Comments
      summary: Mendapatkan Daftar Komentar
      parameters:
        - name: target_id
          in: query
          required: true
          schema:
            type: integer
          example: 2
        - name: target_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - post
              - project
          example: post
      responses:
        '200':
          description: Daftar komentar berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_4'
    post:
      tags:
        - Comments
      summary: Menambah Komentar Baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/comments_body'
      responses:
        '201':
          description: Komentar berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201_1'

  /comments/{id}:
    delete:
      tags:
        - Comments
      summary: Menghapus Komentar Milik Sendiri
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 8
      responses:
        '200':
          description: Komentar berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
        '403':
          description: Unauthorized (Bukan milik user)

components:
  schemas:
    LandingPageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Landing page data fetched successfully
        data:
          type: object
          properties:
            top_projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            category_projects:
              type: array
              items:
                $ref: '#/components/schemas/CategoryProjects'
            hot_projects:
              type: array
              items:
                $ref: '#/components/schemas/HotProject'

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, investor, creator]
        date:
          type: string
          format: date-time
        is_verified:
          type: boolean

    ProjectImage:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
          format: uri
        project_id:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        project_images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    HotProject:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            comments_count:
              type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    CategoryProjects:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    # ----------------------------------------------------------------------
    # Schema khusus GET /projects
    #
    # Dibuat terpisah dari schema landing-page (Project/User) karena bentuk
    # response-nya berbeda: relasi gambar memakai key `images` (bukan
    # `project_images`), objek user diringkas (id/username/name saja), dan
    # ditambahkan agregat likes_count/shares_count/investors_count.
    # `comments_count` TIDAK disertakan di sini karena service /projects
    # tidak memanggil withCount('comments').
    # ----------------------------------------------------------------------

    ProjectsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Projects retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProjectListItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        likes_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0
        investors_count:
          type: integer
          example: 0
        user:
          $ref: '#/components/schemas/ProjectListUser'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCategory'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    ProjectListUser:
      type: object
      description: Representasi ringkas user (membatasi kolom sensitif).
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string

    ProjectCategory:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 9
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 5
        has_more_pages:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Failed to retrieve projects
        error:
          type: string
          description: Detail teknis error (sebaiknya disembunyikan di production).

    # ----------------------------------------------------------------------
    # Schema khusus Project Detail (GET /projects/{id}) beserta sub-resource,
    # serta daftar comments & posts (berpaginasi).
    #
    # Semua kolom tanggal (date/from/to) berupa string ISO-8601 karena
    # Resource menstringkan Carbon via ->toISOString() (lihat CLAUDE.md).
    # Objek user memakai representasi ringkas (ProjectListUser).
    # ----------------------------------------------------------------------

    ProjectDetailResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Project retrieved successfully
        data:
          $ref: '#/components/schemas/ProjectDetail'

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        likes_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0
        investors_count:
          type: integer
          example: 0
        owner:
          $ref: '#/components/schemas/ProjectListUser'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCategory'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'
        status_timeline:
          type: array
          items:
            $ref: '#/components/schemas/Timeline'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
        shareholders:
          type: array
          items:
            $ref: '#/components/schemas/Shareholder'
        public_events:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
        posts:
          $ref: '#/components/schemas/PostsSummary'
        comments:
          $ref: '#/components/schemas/CommentsSummary'

    Timeline:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        timeline:
          type: string
        date:
          type: string
          format: date-time

    Milestone:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        budget:
          type: integer

    Shareholder:
      type: object
      properties:
        name:
          type: string
        share:
          type: integer

    PublicEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        date:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
        comment:
          type: string
        date:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/ProjectListUser'

    PostsSummary:
      type: object
      description: Ringkasan posts pada detail proyek (total + preview).
      properties:
        total:
          type: integer
          example: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/Post'

    CommentsSummary:
      type: object
      description: Ringkasan comments pada detail proyek (total + preview).
      properties:
        total:
          type: integer
          example: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    CommentsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comments retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PostsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Posts retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ----------------------------------------------------------------------
    # Schema dari apibackend2 (Authentication, Posts, Comments).
    #
    # Catatan: endpoint Posts/Comments memakai paginator default Laravel
    # (links + meta bergaya Laravel), berbeda dari envelope flat `meta`
    # (PaginationMeta) yang dipakai endpoint Projects. Karena itu schema
    # paginasinya dipisah menjadi LaravelPaginationLinks/LaravelPaginationMeta
    # agar tidak menimpa PaginationMeta milik endpoint Projects.
    # ----------------------------------------------------------------------

    PostResource:
      type: object
      properties:
        id:
          type: integer
          example: 2
        image_url:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158
        description:
          type: string
          example: Uji coba posting update untuk project EcoLoop!
        date:
          type: string
          format: date-time
          example: 2026-07-21T07:54:15Z
        project_url:
          type: string
          nullable: true
          example: "1"
        post_type:
          type: string
          example: project_post
        is_linked_to_project:
          type: boolean
          example: true
        categories:
          type: array
          example:
            - iot
            - green tech
          items:
            type: string
        metrics:
          $ref: '#/components/schemas/PostResource_metrics'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResource'

    CommentResource:
      type: object
      properties:
        id:
          type: integer
          example: 8
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
        comment:
          type: string
          example: Wah selamat atas milestone terbarunya!
        date:
          type: string
          format: date-time
          example: 2026-07-21T07:55:00Z
        project_url:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/CommentResource_user'

    LaravelPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: http://localhost:8000/api/posts?page=1
        last:
          type: string
          nullable: true
          example: http://localhost:8000/api/posts?page=1
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    LaravelPaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        links:
          type: array
          items:
            $ref: '#/components/schemas/LaravelPaginationMeta_links'
        path:
          type: string
          example: http://localhost:8000/api/posts
        per_page:
          type: integer
          example: 10
        to:
          type: integer
          example: 2
        total:
          type: integer
          example: 2

    login_body:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          format: email
          example: rakai@example.com
        password:
          type: string
          format: password
          example: password123

    inline_response_200:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Login successful
        access_token:
          type: string
          example: 3|ep9zfKYqsK7Ayh8KNtL3QYOxq6IC4l8PxeOLV5E0ce380e1c
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/inline_response_200_user'

    inline_response_200_1:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostResource'
        links:
          $ref: '#/components/schemas/LaravelPaginationLinks'
        meta:
          $ref: '#/components/schemas/LaravelPaginationMeta'

    posts_body:
      required:
        - category_titles
        - description
      type: object
      properties:
        description:
          type: string
          example: Uji coba posting update untuk project EcoLoop!
        image_url:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158
        project_url:
          type: string
          nullable: true
          example: "1"
        category_titles:
          type: array
          example:
            - iot
            - green tech
          items:
            type: string
            enum:
              - software
              - iot
              - green tech
              - robotics
              - hardware
              - agriculture

    inline_response_201:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Update published successfully!
        data:
          $ref: '#/components/schemas/PostResource'

    inline_response_200_2:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostResource'

    posts_togglelike_body:
      required:
        - target_id
        - target_type
      type: object
      properties:
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
          enum:
            - post
            - project

    inline_response_200_3:
      type: object
      properties:
        message:
          type: string
          example: Liked
        is_liked:
          type: boolean
          example: true

    inline_response_200_4:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommentResource'

    comments_body:
      required:
        - comment
        - target_id
        - target_type
      type: object
      properties:
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
          enum:
            - post
            - project
        comment:
          type: string
          example: Wah selamat atas milestone terbarunya!
        project_url:
          type: string
          nullable: true

    inline_response_201_1:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comment created successfully
        data:
