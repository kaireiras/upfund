openapi: 3.0.3
info:
  title: Upfund Landing Page API
  description: API Agregator untuk Landing Page Upfund (BFF Pattern).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api
    description: Development server

paths:
  /landing-page:
    get:
      summary: Mendapatkan data agregat untuk Landing Page
      description: Mengambil data proyek unggulan (top projects), proyek per kategori, dan proyek hangat (hot projects) dalam satu request.
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageResponse'

  /projects:
    get:
      summary: Mendapatkan daftar proyek (berpaginasi)
      description: >
        Mengambil daftar proyek berpaginasi (9 item per halaman), dapat difilter
        berdasarkan kategori. Setiap item menyertakan agregat interaksi
        (likes_count, shares_count, investors_count) serta relasi user (ringkas),
        categories, dan images.
      parameters:
        - name: category
          in: query
          required: false
          description: Filter proyek berdasarkan judul kategori (mis. "Teknologi").
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar proyek berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListResponse'
        '500':
          description: Gagal mengambil daftar proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
          summary: Membuat proyek baru
          description: >
            Membuat proyek baru beserta cover image, kategori, shareholders, dan
            milestones sekaligus secara atomik. Total owned_equity_percent seluruh
            shareholder tidak boleh melebihi 100%. Total release_budget_percent
            seluruh milestone harus tepat 100%. Memerlukan autentikasi.
          security:
            - sanctumAuth: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateProjectRequest'
          responses:
            '201':
              description: Proyek berhasil dibuat
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ProjectDetailResponse'
            '401':
              description: Tidak terautentikasi
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ErrorResponse'
            '422':
              description: Data tidak valid (mis. total shareholder >100%, total milestone bukan 100%, kategori >5)
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ValidationErrorResponse'

  /categories:
    get:
      summary: Mendapatkan daftar seluruh kategori proyek
      description: >
        Mengambil semua kategori yang tersedia untuk proyek (bukan kategori
        post), diurutkan alfabetis. Digunakan untuk mengisi pilihan kategori
        saat membuat proyek. Tidak memerlukan autentikasi.
      responses:
        '200':
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'

  /projects/{id}:
    get:
      summary: Mendapatkan detail sebuah proyek
      description: >
        Mengambil detail lengkap satu proyek beserta relasi (owner, categories,
        images, status_timeline, milestones, shareholders, public_events),
        agregat interaksi (likes_count, shares_count, investors_count), serta
        ringkasan posts & comments (total + preview).
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
      responses:
        '200':
          description: Detail proyek berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil detail proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/comments:
    get:
      summary: Mendapatkan daftar komentar sebuah proyek (berpaginasi)
      description: Mengambil komentar proyek berpaginasi (15 item per halaman), diurutkan dari yang terbaru.
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar komentar berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsListResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil komentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/posts:
    get:
      summary: Mendapatkan daftar posts sebuah proyek (berpaginasi)
      description: Mengambil posts proyek berpaginasi (15 item per halaman), diurutkan dari yang terbaru.
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar posts berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsListResponse'
        '404':
          description: Proyek tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal mengambil posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/investors:
    get:
      tags:
        - Projects
      summary: Mendapatkan daftar investor sebuah proyek (berpaginasi)
      description: >
        Mengambil daftar investor (riwayat investasi) pada satu proyek,
        berpaginasi (15 item per halaman, paginator default Laravel), diurutkan
        dari yang terbaru. Tiap item menyertakan user investor & ringkasan
        transaksinya.
      parameters:
        - name: id
          in: path
          required: true
          description: ID proyek.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar investor berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentHistoriesResponse'

  /login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Mendapatkan Bearer Token untuk autentikasi API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login_body'
      responses:
        '200':
          description: Login Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
        '401':
          description: Kredensial tidak valid

  /posts:
    get:
      tags:
        - Posts
      summary: Mendapatkan Feed Postingan (Paginated)
      parameters:
        - name: page
          in: query
          description: Nomor halaman pagination
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Daftar postingan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_1'
    post:
      tags:
        - Posts
      summary: Membuat Postingan Baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/posts_body'
      responses:
        '201':
          description: Postingan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Mendapatkan Detail Postingan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Detail postingan berhasil ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_2'
        '404':
          description: Post tidak ditemukan

  /interactions/like:
    post:
      tags:
        - Posts
      summary: Toggle Like/Unlike Post atau Project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/posts_togglelike_body'
      responses:
        '200':
          description: Berhasil mengubah status Like
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_3'

  /comments:
    get:
      tags:
        - Comments
      summary: Mendapatkan Daftar Komentar
      parameters:
        - name: target_id
          in: query
          required: true
          schema:
            type: integer
          example: 2
        - name: target_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - post
              - project
          example: post
      responses:
        '200':
          description: Daftar komentar berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_4'
    post:
      tags:
        - Comments
      summary: Menambah Komentar Baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/comments_body'
      responses:
        '201':
          description: Komentar berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201_1'

  /comments/{id}:
    delete:
      tags:
        - Comments
      summary: Menghapus Komentar Milik Sendiri
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 8
      responses:
        '200':
          description: Komentar berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
        '403':
          description: Unauthorized (Bukan milik user)

  /profile:
    get:
      tags:
        - Profile
      summary: Mendapatkan Profil User yang Sedang Login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthenticated
    put:
      tags:
        - Profile
      summary: Memperbarui Profil User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profile_body'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '401':
          description: Unauthenticated
        '422':
          description: Validasi gagal

  /kyc:
    post:
      tags:
        - KYC
      summary: Submit Dokumen KYC Baru
      description: Upload dokumen KYC (multipart/form-data). Gagal jika status KYC masih pending atau sudah approved.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/kyc_body'
      responses:
        '201':
          description: KYC berhasil disubmit dan sedang direview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '400':
          description: KYC masih direview atau sudah terverifikasi
        '401':
          description: Unauthenticated
        '422':
          description: Validasi gagal

  /kyc/status:
    get:
      tags:
        - KYC
      summary: Mengecek Status KYC User yang Sedang Login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status KYC berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatusResponse'
        '401':
          description: Unauthenticated

  /admin/kyc/{id}/verify:
    post:
      tags:
        - KYC
      summary: Update Status KYC (Approve / Reject)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID record KYC.
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kyc_verify_body'
      responses:
        '200':
          description: Status KYC berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResponse'
        '401':
          description: Unauthenticated
        '422':
          description: Validasi gagal

  /transactions:
    post:
      tags:
        - Transactions
      summary: Membuat transaksi investasi & mendapatkan Snap Token (Midtrans)
      description: >
        Membuat transaksi investasi pada sebuah proyek. Server menghitung
        platform fee 10% di atas nilai investasi, membuat baris transaksi
        berstatus `pending`, lalu meminta Snap Token ke Midtrans. Frontend
        memakai snap_token untuk membuka popup pembayaran Midtrans.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transactions_body'
      responses:
        '201':
          description: Transaksi dibuat & Snap Token berhasil digenerate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCreateResponse'
        '401':
          description: Unauthenticated
        '422':
          description: Validasi gagal (project_id tidak valid / amount < 10000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Gagal generate Snap Token dari Midtrans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /midtrans/notification:
    post:
      tags:
        - Transactions
      summary: Webhook notifikasi pembayaran dari Midtrans
      description: >
        Endpoint callback yang dipanggil server Midtrans saat status pembayaran
        berubah (settlement/capture/pending/deny/expire/cancel). Publik (tanpa
        auth) karena dipanggil server-to-server oleh Midtrans. Saat pembayaran
        lunas, status transaksi menjadi `paid`, `collected_funds` proyek
        ditambah, dan baris InvestmentHistory dibuat. Payload di bawah adalah
        fallback bila SDK Midtrans tidak terinisialisasi (mis. saat tes manual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/midtrans_notification_body'
      responses:
        '200':
          description: Notifikasi berhasil diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleStatusResponse'
        '400':
          description: Payload tidak valid (order_id tidak ada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal memproses notifikasi (mis. order_id tidak ditemukan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/investment-histories:
    get:
      tags:
        - Transactions
      summary: Mendapatkan riwayat investasi user yang sedang login (berpaginasi)
      description: >
        Mengambil daftar investasi milik user yang sedang login, berpaginasi
        (10 item per halaman, paginator default Laravel), diurutkan dari yang
        terbaru. Tiap item menyertakan proyek terkait & ringkasan transaksinya.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Nomor halaman (mulai dari 1). Default 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Riwayat investasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentHistoriesResponse'
        '401':
          description: Unauthenticated

components:
  schemas:
    LandingPageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Landing page data fetched successfully
        data:
          type: object
          properties:
            top_projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            category_projects:
              type: array
              items:
                $ref: '#/components/schemas/CategoryProjects'
            hot_projects:
              type: array
              items:
                $ref: '#/components/schemas/HotProject'

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, investor, creator]
        date:
          type: string
          format: date-time
        is_verified:
          type: boolean

    ProjectImage:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
          format: uri
        project_id:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        project_images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'
    CreateProjectRequest:
      type: object
      required:
        - title
        - description
        - video_pitch_url
        - cover_image_url
        - company_valuation
        - funding_target
        - categories
        - shareholders
        - milestones
      properties:
        title:
          type: string
          maxLength: 100
          example: "Aplikasi Pertanian Pintar"
        description:
          type: string
          example: "Platform yang membantu petani memonitor lahan secara digital."
        video_pitch_url:
          type: string
          format: uri
          maxLength: 1024
        cover_image_url:
          type: string
          format: uri
          maxLength: 1024
        company_valuation:
          type: integer
          minimum: 0
          example: 5000000000
        funding_target:
          type: integer
          minimum: 0
          example: 750000000
        categories:
          type: array
          minItems: 1
          maxItems: 5
          description: Daftar ID kategori (maksimal 5, harus ada di GET /categories).
          items:
            type: integer
          example: [1, 3, 5]
        shareholders:
          type: array
          minItems: 1
          description: Total owned_equity_percent seluruh item tidak boleh melebihi 100.
          items:
            $ref: '#/components/schemas/ShareholderInput'
        milestones:
          type: array
          minItems: 1
          description: Total release_budget_percent seluruh item harus tepat 100.
          items:
            $ref: '#/components/schemas/MilestoneInput'

    ShareholderInput:
      type: object
      required:
        - name
        - owned_equity_percent
      properties:
        name:
          type: string
          maxLength: 255
          example: "Helena Vance (Founder)"
        owned_equity_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Persentase kepemilikan, maksimal 2 desimal.
          example: 12.5

    MilestoneInput:
      type: object
      required:
        - title
        - description
        - start_date
        - end_date
        - release_budget_percent
      properties:
        title:
          type: string
          maxLength: 100
          example: "Prototype development"
        description:
          type: string
          example: "Build version 1 model and test core functionalities."
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: Harus setelah start_date.
        release_budget_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 50

    CategoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Categories retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: "Teknologi"

    HotProject:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            comments_count:
              type: integer

    CategoryProjects:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    # ----------------------------------------------------------------------
    # Schema khusus GET /projects
    #
    # Dibuat terpisah dari schema landing-page (Project/User) karena bentuk
    # response-nya berbeda: relasi gambar memakai key `images` (bukan
    # `project_images`), objek user diringkas (id/username/name saja), dan
    # ditambahkan agregat likes_count/shares_count/investors_count.
    # `comments_count` TIDAK disertakan di sini karena service /projects
    # tidak memanggil withCount('comments').
    # ----------------------------------------------------------------------

    ProjectsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Projects retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProjectListItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        likes_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0
        investors_count:
          type: integer
          example: 0
        user:
          $ref: '#/components/schemas/ProjectListUser'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCategory'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'

    ProjectListUser:
      type: object
      description: Representasi ringkas user (membatasi kolom sensitif).
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string

    ProjectCategory:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 9
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 5
        has_more_pages:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Failed to retrieve projects
        error:
          type: string
          description: Detail teknis error (sebaiknya disembunyikan di production).

    SimpleStatusResponse:
      type: object
      description: Envelope respons ringkas (hanya status + message).
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Notification processed

    ValidationErrorResponse:
          type: object
          description: Bentuk error validasi (map field -> array pesan), dibungkus envelope standar.
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: The given data was invalid.
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                shareholders: ["Total shareholders owned_equity_percent tidak boleh melebihi 100 (saat ini 110)."]
                categories: ["Maksimal 5 kategori per project."]
                amount: ["The amount field must be at least 10000."]

    # ----------------------------------------------------------------------
    # Schema untuk POST /projects (create).
    #
    # Response 201 memakai ProjectResource (schema ProjectListItem) — sama
    # dengan item pada GET /projects. category_ids opsional; bila diisi,
    # kategori di-attach via pivot.
    # ----------------------------------------------------------------------

    store_project_body:
      type: object
      required:
        - title
        - description
        - valuation
      properties:
        title:
          type: string
          maxLength: 255
          example: EcoCharge Solar Pods
        description:
          type: string
          example: Portable solar charging pods for off-grid communities.
        video_url:
          type: string
          format: uri
          nullable: true
          example: https://youtube.com/watch?v=ecocharge
        valuation:
          type: number
          minimum: 0
          example: 5000000
        investment_url:
          type: string
          format: uri
          nullable: true
          example: https://upfund.test/invest/ecocharge
        date:
          type: string
          format: date
          nullable: true
          description: Opsional; default now() bila tidak dikirim.
        category_ids:
          type: array
          nullable: true
          description: Opsional. Daftar ID kategori yang di-attach (harus exists di tabel categories).
          items:
            type: integer
          example: [1, 2]

    StoreProjectResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Project created successfully
        data:
          $ref: '#/components/schemas/ProjectListItem'

    # ----------------------------------------------------------------------
    # Schema untuk Transactions & Investment Histories (Midtrans).
    # ----------------------------------------------------------------------

    transactions_body:
      type: object
      required:
        - project_id
        - amount
      properties:
        project_id:
          type: integer
          description: ID proyek yang diinvestasikan (harus exists).
          example: 1
        amount:
          type: integer
          minimum: 10000
          description: Nilai investasi murni (belum termasuk platform fee 10%).
          example: 20000000

    TransactionBreakdown:
      type: object
      properties:
        investment_amount:
          type: integer
          example: 20000000
        platform_fee:
          type: integer
          description: 10% dari investment_amount.
          example: 2000000
        grand_total:
          type: integer
          description: Total yang dibayarkan ke Midtrans (investment_amount + platform_fee).
          example: 22000000

    Transaction:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: string
          example: TRX-1753600000-123
        user_id:
          type: integer
        project_id:
          type: integer
        amount:
          type: integer
          example: 20000000
        status:
          type: string
          enum: [pending, processing, paid, failed]
          example: pending
        payment_type:
          type: string
          nullable: true
        snap_token:
          type: string
          nullable: true
        date:
          type: string
          format: date-time

    TransactionCreateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Payment generated successfully
        snap_token:
          type: string
          example: 66e4fa55-fdac-4ef9-91b5-733b97d1b862
        breakdown:
          $ref: '#/components/schemas/TransactionBreakdown'
        data:
          $ref: '#/components/schemas/Transaction'

    midtrans_notification_body:
      type: object
      description: >
        Payload notifikasi Midtrans (fallback bila SDK tidak terinisialisasi).
        Pada produksi, dikirim oleh server Midtrans.
      required:
        - order_id
        - transaction_status
      properties:
        order_id:
          type: string
          example: TRX-1753600000-123
        transaction_status:
          type: string
          enum: [capture, settlement, pending, deny, expire, cancel]
          example: settlement
        payment_type:
          type: string
          example: bank_transfer
        fraud_status:
          type: string
          nullable: true
          example: accept

    InvestmentHistory:
      type: object
      properties:
        id:
          type: integer
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
          description: Hanya disertakan saat relasi user di-eager-load (mis. endpoint investors proyek).
        project:
          allOf:
            - $ref: '#/components/schemas/ProjectListItem'
          nullable: true
          description: Hanya disertakan saat relasi project di-eager-load (mis. endpoint riwayat user).
        transaction:
          type: object
          properties:
            id:
              type: integer
            order_id:
              type: string
            amount:
              type: integer
            payment_type:
              type: string
              nullable: true
            status:
              type: string
            date:
              type: string
              format: date-time

    InvestmentHistoriesResponse:
      type: object
      description: >
        Koleksi berpaginasi (paginator default Laravel — wrapper data + links + meta).
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentHistory'
        links:
          $ref: '#/components/schemas/LaravelPaginationLinks'
        meta:
          $ref: '#/components/schemas/LaravelPaginationMeta'

    # ----------------------------------------------------------------------
    # Schema khusus Project Detail (GET /projects/{id}) beserta sub-resource,
    # serta daftar comments & posts (berpaginasi).
    #
    # Semua kolom tanggal (date/from/to) berupa string ISO-8601 karena
    # Resource menstringkan Carbon via ->toISOString() (lihat CLAUDE.md).
    # Objek user memakai representasi ringkas (ProjectListUser).
    # ----------------------------------------------------------------------

    ProjectDetailResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Project retrieved successfully
        data:
          $ref: '#/components/schemas/ProjectDetail'

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        video_url:
          type: string
          format: uri
          nullable: true
        valuation:
          type: integer
        collected_funds:
          type: integer
        investment_url:
          type: string
          format: uri
          nullable: true
        likes_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0
        investors_count:
          type: integer
          example: 0
        owner:
          $ref: '#/components/schemas/ProjectListUser'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCategory'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProjectImage'
        status_timeline:
          type: array
          items:
            $ref: '#/components/schemas/Timeline'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
        shareholders:
          type: array
          items:
            $ref: '#/components/schemas/Shareholder'
        public_events:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
        posts:
          $ref: '#/components/schemas/PostsSummary'
        comments:
          $ref: '#/components/schemas/CommentsSummary'

    Timeline:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        timeline:
          type: string
        date:
          type: string
          format: date-time

    Milestone:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        budget:
          type: integer

    Shareholder:
      type: object
      properties:
        name:
          type: string
        share:
          type: integer

    PublicEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        date:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
        comment:
          type: string
        date:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/ProjectListUser'

    PostsSummary:
      type: object
      description: Ringkasan posts pada detail proyek (total + preview).
      properties:
        total:
          type: integer
          example: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/Post'

    CommentsSummary:
      type: object
      description: Ringkasan comments pada detail proyek (total + preview).
      properties:
        total:
          type: integer
          example: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    CommentsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comments retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PostsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Posts retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ----------------------------------------------------------------------
    # Schema dari apibackend2 (Authentication, Posts, Comments).
    #
    # Catatan: endpoint Posts/Comments memakai paginator default Laravel
    # (links + meta bergaya Laravel), berbeda dari envelope flat `meta`
    # (PaginationMeta) yang dipakai endpoint Projects. Karena itu schema
    # paginasinya dipisah menjadi LaravelPaginationLinks/LaravelPaginationMeta
    # agar tidak menimpa PaginationMeta milik endpoint Projects.
    # ----------------------------------------------------------------------

    PostResource:
      type: object
      properties:
        id:
          type: integer
          example: 2
        image_url:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158
        description:
          type: string
          example: Uji coba posting update untuk project EcoLoop!
        date:
          type: string
          format: date-time
          example: 2026-07-21T07:54:15Z
        project_url:
          type: string
          nullable: true
          example: "1"
        post_type:
          type: string
          example: project_post
        is_linked_to_project:
          type: boolean
          example: true
        categories:
          type: array
          example:
            - iot
            - green tech
          items:
            type: string
        metrics:
          $ref: '#/components/schemas/PostResource_metrics'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResource'

    CommentResource:
      type: object
      properties:
        id:
          type: integer
          example: 8
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
        comment:
          type: string
          example: Wah selamat atas milestone terbarunya!
        date:
          type: string
          format: date-time
          example: 2026-07-21T07:55:00Z
        project_url:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/CommentResource_user'

    LaravelPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: http://localhost:8000/api/posts?page=1
        last:
          type: string
          nullable: true
          example: http://localhost:8000/api/posts?page=1
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    LaravelPaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        links:
          type: array
          items:
            $ref: '#/components/schemas/LaravelPaginationMeta_links'
        path:
          type: string
          example: http://localhost:8000/api/posts
        per_page:
          type: integer
          example: 10
        to:
          type: integer
          example: 2
        total:
          type: integer
          example: 2

    login_body:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          format: email
          example: rakai@example.com
        password:
          type: string
          format: password
          example: password123

    inline_response_200:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Login successful
        access_token:
          type: string
          example: 3|ep9zfKYqsK7Ayh8KNtL3QYOxq6IC4l8PxeOLV5E0ce380e1c
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/inline_response_200_user'

    inline_response_200_1:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostResource'
        links:
          $ref: '#/components/schemas/LaravelPaginationLinks'
        meta:
          $ref: '#/components/schemas/LaravelPaginationMeta'

    posts_body:
      required:
        - category_titles
        - description
      type: object
      properties:
        description:
          type: string
          example: Uji coba posting update untuk project EcoLoop!
        image_url:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158
        project_url:
          type: string
          nullable: true
          example: "1"
        category_titles:
          type: array
          example:
            - iot
            - green tech
          items:
            type: string
            enum:
              - software
              - iot
              - green tech
              - robotics
              - hardware
              - agriculture

    inline_response_201:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Update published successfully!
        data:
          $ref: '#/components/schemas/PostResource'

    inline_response_200_2:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostResource'

    posts_togglelike_body:
      required:
        - target_id
        - target_type
      type: object
      properties:
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
          enum:
            - post
            - project

    inline_response_200_3:
      type: object
      properties:
        message:
          type: string
          example: Liked
        is_liked:
          type: boolean
          example: true

    inline_response_200_4:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommentResource'

    comments_body:
      required:
        - comment
        - target_id
        - target_type
      type: object
      properties:
        target_id:
          type: integer
          example: 2
        target_type:
          type: string
          example: post
          enum:
            - post
            - project
        comment:
          type: string
          example: Wah selamat atas milestone terbarunya!
        project_url:
          type: string
          nullable: true

    inline_response_201_1:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comment created successfully
        data:
          $ref: '#/components/schemas/CommentResource'

    inline_response_200_5:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Comment deleted successfully

    PostResource_metrics:
      type: object
      properties:
        likes_count:
          type: integer
          example: 0
        comments_count:
          type: integer
          example: 0
        shares_count:
          type: integer
          example: 0

    CommentResource_user:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: rakai
        avatar_url:
          type: string
          nullable: true

    LaravelPaginationMeta_links:
      type: object
      properties:
        url:
          type: string
          nullable: true
          example: http://localhost:8000/api/posts?page=1
        label:
          type: string
          example: "1"
        active:
          type: boolean
          example: true

    inline_response_200_user:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: rakai
        email:
          type: string
          example: rakai@example.com

    # ----------------------------------------------------------------------
    # Schema untuk Profile & KYC (branch userprofile).
    # ----------------------------------------------------------------------

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Test User
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: test@upfund.com
        bio:
          type: string
          nullable: true
          example: Investor di Upfund
        avatar_url:
          type: string
          nullable: true
        bank_account_details:
          type: string
          nullable: true
          example: Bank BCA - 1234567890
        residential_address:
          type: string
          nullable: true
          example: Jl. Test No. 1, Jakarta
        is_verified:
          type: boolean
          example: false
        verification_badge:
          type: string
          example: UNVERIFIED
        kyc_status:
          type: string
          enum:
            - unsubmitted
            - pending
            - approved
            - rejected
          example: pending
        member_since:
          type: string
          nullable: true
          example: Jul 2026
        role:
          type: string
          example: investor

    ProfileResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/UserProfile'

    ProfileUpdateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Profile updated successfully!
        data:
          $ref: '#/components/schemas/UserProfile'

    profile_body:
      required:
        - name
        - email
      type: object
      properties:
        name:
          type: string
          example: Test User
        username:
          type: string
          nullable: true
          example: testuser
        email:
          type: string
          format: email
          example: test@upfund.com
        bio:
          type: string
          nullable: true
          example: Investor di Upfund
        avatar_url:
          type: string
          nullable: true
        bank_account_details:
          type: string
          nullable: true
          example: Bank BCA - 1234567890

    Kyc:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        company_document_url:
          type: string
          example: https://example.com/docs/company.pdf
        bank_document_url:
          type: string
          example: https://example.com/docs/bank.pdf
        address:
          type: string
          example: Jl. Test No. 1, Jakarta
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          example: pending
        rejection_reason:
          type: string
          nullable: true

    KycResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: KYC submitted successfully and is now under review.
        data:
          $ref: '#/components/schemas/Kyc'

    KycStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Status agregat pengajuan KYC.
          enum:
            - unsubmitted
            - success
          example: success
        data:
          allOf:
            - $ref: '#/components/schemas/Kyc'
          nullable: true

    kyc_body:
      required:
        - company_document
        - bank_document
        - address
      type: object
      properties:
        company_document:
          type: string
          format: binary
          description: Dokumen perusahaan (PDF, maks 5MB).
        bank_document:
          type: string
          format: binary
          description: Dokumen bank (PDF, maks 5MB).
        address:
          type: string
          example: Jl. Test No. 1, Jakarta

    kyc_verify_body:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
          example: approved
        rejection_reason:
          type: string
          nullable: true
          description: Wajib diisi jika status = rejected.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
